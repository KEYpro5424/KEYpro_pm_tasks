<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新規事業 進行ボード</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#12355B; --brand-ink:#FFFFFF; --accent:#0E8FA0; --accent-soft:#E0F2F5;
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#17212D; --muted:#5A6777; --line:#DCE2E9;
  --ok:#17784A; --ok-bg:#E2F3EA; --hold:#9A5B00; --hold-bg:#FFEFD2; --bad:#B1332A; --bad-bg:#FBE4E1; --info:#3B5775; --info-bg:#E8EEF5;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#0B2440; --brand-ink:#EAF1F8; --accent:#5CC4D3; --accent-soft:#16333A;
    --bg:#0E141B; --surface:#16202B; --ink:#E6ECF2; --muted:#9AA8B7; --line:#2A3745;
    --ok:#6FD39A; --ok-bg:#12301F; --hold:#F0B45A; --hold-bg:#3A2A0C; --bad:#FF9188; --bad-bg:#3C1815; --info:#A9C0D8; --info-bg:#1F2D3C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#0B2440; --brand-ink:#EAF1F8; --accent:#5CC4D3; --accent-soft:#16333A;
  --bg:#0E141B; --surface:#16202B; --ink:#E6ECF2; --muted:#9AA8B7; --line:#2A3745;
  --ok:#6FD39A; --ok-bg:#12301F; --hold:#F0B45A; --hold-bg:#3A2A0C; --bad:#FF9188; --bad-bg:#3C1815; --info:#A9C0D8; --info-bg:#1F2D3C; color-scheme:dark;
}
html{height:auto;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
@media (max-width:560px){.wrap{padding:0 14px}}

.hero{background:var(--brand);color:var(--brand-ink)}
.hero .wrap{padding-top:22px;padding-bottom:20px;display:grid;gap:14px}
.titlein{background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.4);color:inherit;font-size:24px;font-weight:700;width:100%;max-width:560px;padding:2px 0}
.titlein:focus{outline:none;border-bottom-color:#fff}
.hstat{display:grid;grid-template-columns:1.1fr 1.4fr 1.4fr;gap:12px}
@media (max-width:820px){.hstat{grid-template-columns:1fr}}
.hbox{background:rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;min-width:0}
.hbox small{display:block;font-size:12px;opacity:.8}
.hbox b{display:block;font-size:15px;line-height:1.5}
.big{font-size:28px!important;font-weight:700;line-height:1.2!important}
.pbar{height:8px;background:rgba(255,255,255,.22);border-radius:4px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:#6FE3B2;transition:width .3s}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:focus-visible{outline:3px solid var(--accent)}

.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tabbar .wrap{display:flex;align-items:center;gap:12px}
.tabs{display:flex;overflow-x:auto;flex:1;scrollbar-width:thin}
.tab{flex:0 0 auto;border:0;background:transparent;padding:13px 14px 11px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.mini{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);max-width:44%}
.mini .m-bar{width:70px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:0 0 auto}
.mini .m-bar i{display:block;height:100%;background:var(--ok)}
.mini span.nx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){.mini .nx{display:none}}

main{padding:22px 0 56px}
.panel[hidden]{display:none}
h2{margin:0 0 12px;font-size:19px;color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h2{color:var(--ink)}}
:root[data-theme="dark"] h2{color:var(--ink)}
h3{margin:0 0 8px;font-size:15px}
.lead{color:var(--muted);margin:-4px 0 16px;font-size:13.5px}
.sub{font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.stack{display:grid;gap:16px}
.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;line-height:1;padding:5px 8px;border-radius:5px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.hold{background:var(--hold-bg);color:var(--hold)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-size:13.5px}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.fld{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 9px;width:100%;min-width:0}
textarea.fld{resize:vertical;min-height:64px;line-height:1.6}
label.l{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}

/* flow */
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.step{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.step > div{padding:10px 14px 10px}
.step.cur{background:var(--accent-soft);border-color:var(--accent)}
.step.done{background:var(--ok-bg);border-color:transparent}
.step b{display:block;font-size:14px;line-height:1.4}
.step small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.step .pb{height:5px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden}
.step .pb i{display:block;height:100%;background:var(--ok)}
@media (max-width:620px){.flow{grid-template-columns:1fr}}

.pol{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.pol:first-child{border-top:0}
.pol .nt{grid-column:2;font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.feed li{padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;list-style:none}
.feed li:first-child{border-top:0}
.feed{margin:0;padding:0}
.feed time{color:var(--muted);font-size:12px;margin-right:8px;font-variant-numeric:tabular-nums}

/* todo */
.ph-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.ph-h h3{margin:0;font-size:16px}
.todo{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.todo input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--accent)}
.todo.done .tt{text-decoration:line-through;color:var(--muted)}
.todo .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.todo details{margin-top:8px}
.todo summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:500}
.dinp{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:2px 6px;font-size:12.5px}
.memo-snip{margin-top:6px;font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px;white-space:pre-wrap}
.addrow{display:grid;grid-template-columns:150px 1fr auto;gap:8px}
@media (max-width:620px){.addrow{grid-template-columns:1fr}}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tph{position:relative;padding:0 0 22px 34px}
.tph::before{content:"";position:absolute;left:12px;top:30px;bottom:-4px;width:3px;background:var(--line)}
.tph:last-child::before{display:none}
.tph.donep::before{background:var(--ok)}
.tph > .dot{position:absolute;left:0;top:2px;width:27px;height:27px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.tph.donep > .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tph.curp > .dot{border-color:var(--accent);color:var(--accent)}
.tph > header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tph > header b{font-size:16px}
.tn{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tnode{display:grid;grid-template-columns:auto 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.tnode.done{background:var(--ok-bg);border-color:transparent}
.tnode.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tnode .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;font-size:13px;color:#fff;padding:0}
.tnode.done .ck{background:var(--ok);border-color:var(--ok)}
.tnode.done .tt{text-decoration:line-through;color:var(--muted)}
.tnode .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}

/* supplier / quote */
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:620px){.fg{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:860px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);border-top:0}
td .fld{padding:5px 7px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sumbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}

.sbx{border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px;padding:10px 12px;background:var(--surface)}
.sbx small{display:block;color:var(--muted);font-size:12px}
.sbx b{font-size:20px;line-height:1.3}
.sbx.warn{border-top-color:var(--bad)}
.sbx.good{border-top-color:var(--ok)}
.logrow{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.logrow:first-child{border-top:0}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 4px transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.pbar i{transition:none}}
/* schedule */
.gt{min-width:760px}
.grow{display:grid;grid-template-columns:210px 1fr;border-top:1px solid var(--line)}
.grow.gh{border-top:0}
.glab{position:sticky;left:0;z-index:3;background:var(--surface);padding:6px 10px 6px 4px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.glab b{font-size:13.5px;line-height:1.35}
.gtrack{position:relative;height:50px}
.gh .gtrack{height:38px}
.gline{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.gmon{position:absolute;top:0;bottom:0;padding:6px 8px;font-weight:700;font-size:13px;white-space:nowrap}
.gmon small{display:block;font-weight:400;color:var(--muted);font-size:11px;line-height:1.2}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2;pointer-events:none}
.gtoday-l{position:absolute;top:2px;transform:translateX(-50%);background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;z-index:3;white-space:nowrap}
.gbar{position:absolute;top:9px;height:32px;border-radius:7px;background:var(--info-bg);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;z-index:1}
.gfill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.4}
.gbar.done{border-color:var(--ok)}
.gbar.done .gfill{background:var(--ok);opacity:.45}
.gbar.late{border-color:var(--bad);border-width:2px}
.gbar.soft{background:transparent;border-style:dashed;border-color:var(--muted)}
.gbar span{position:relative;padding:0 8px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.gbar.lead{background:repeating-linear-gradient(45deg,var(--hold-bg),var(--hold-bg) 6px,transparent 6px,transparent 12px);border:1px dashed var(--hold)}
.card.warnc{border-left:6px solid var(--bad)}
.gdl{position:absolute;top:15px;width:20px;height:20px;transform:translateX(-50%) rotate(45deg);background:var(--surface);border:3px solid var(--accent);border-radius:3px;z-index:1}
.gdl.done{background:var(--ok);border-color:var(--ok)}
.gdl.late{border-color:var(--bad)}
.gdl-l{position:absolute;top:14px;font-size:12px;font-weight:700;white-space:nowrap;z-index:1}
.due-l{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center;font-size:14px}
.due-l:first-of-type{border-top:0}
.seged{display:grid;grid-template-columns:1.2fr 1fr 150px 150px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
@media (max-width:700px){.seged{grid-template-columns:1fr 1fr}}
.addrow4{display:grid;grid-template-columns:150px 1fr 150px auto;gap:8px}
@media (max-width:760px){.addrow4{grid-template-columns:1fr 1fr}.addrow4 > input[type=text],.addrow4 > .tx{grid-column:1/-1}}
.mtcard header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.mtcard header b{font-size:16px}
.mtbody{white-space:pre-wrap;line-height:1.75;margin:0 0 12px;font-size:14.5px}
.mttodo{border-top:1px dashed var(--line);padding-top:10px}
.mttodo .t{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:5px 0;align-items:start}
.mttodo .t input{width:20px;height:20px;accent-color:var(--accent);margin-top:3px}
.mttodo .t.done .tt{text-decoration:line-through;color:var(--muted)}
.pam{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:12px}
@media (max-width:760px){.pam{grid-template-columns:1fr}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--line)}
.sh-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
.pi{display:grid;grid-template-columns:auto 1fr;gap:9px;padding:5px 0;align-items:start;font-size:14px;cursor:pointer}
.pi input{width:19px;height:19px;accent-color:var(--accent);margin-top:3px}
.pi.done span{text-decoration:line-through;color:var(--muted)}
.sharebar{background:var(--info-bg);color:var(--info);font-size:13px;padding:6px 0}
.sharebar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sharebar.live{background:var(--ok-bg);color:var(--ok)}
.sharebar.warn{background:var(--hold-bg);color:var(--hold)}
.sharebar.err{background:var(--bad-bg);color:var(--bad)}
body.ro main [data-act],body.ro main [data-f],body.ro main [data-pam],body.ro main .ck{pointer-events:none;opacity:.6}
footer{padding:0 0 30px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div>
      <input class="titlein" id="titleIn" data-f="title" aria-label="プロジェクト名" value="">
      <div style="font-size:13px;opacity:.82;margin-top:2px">新規事業の進行ボード(全体の流れ・方針・取引先・ToDoを1か所で管理)</div>
    </div>
    <div class="hstat" id="hstat"></div>
  </div>
</header>

<div class="sharebar" id="sharebar" role="status" aria-live="polite"></div>

<nav class="tabbar" aria-label="表示切り替え">
  <div class="wrap">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="mini" id="mini" aria-live="polite"></div>
  </div>
</nav>

<main class="wrap">
  <section class="panel" id="panel-ov" role="tabpanel"></section>
  <section class="panel" id="panel-sch" role="tabpanel" hidden></section>
  <section class="panel" id="panel-todo" role="tabpanel" hidden></section>
  <section class="panel" id="panel-tl" role="tabpanel" hidden></section>
  <section class="panel" id="panel-mt" role="tabpanel" hidden></section>
  <section class="panel" id="panel-pam" role="tabpanel" hidden></section>
  <section class="panel" id="panel-sup" role="tabpanel" hidden></section>
</main>

<footer class="wrap">
  <span id="footnote">入力内容は自動保存されます。</span>
  <button class="btn sm" id="resetBtn" style="margin-left:8px">保存内容をすべて消す</button>
</footer>

<script>
/* ================= 初期データ ================= */
const PHASES=[
 {id:'p1',name:'テスト品を手に入れる',sub:'発注・色塗り'},
 {id:'p2',name:'特許申請',sub:'調べる・申請'},
 {id:'p3',name:'販売方法を考える',sub:'サイト・在庫・発送・注文'},
 {id:'p4',name:'値段設定',sub:'いくらで売るか'},
 {id:'p5',name:'パンフレット作成',sub:'収集・撮影・デザイン'},
 {id:'p6',name:'原本1,000個を発注',sub:'2色 各500個'},
 {id:'p7',name:'病院でお試し(100個)',sub:'依頼・発送・フィードバック'},
 {id:'p8',name:'販売',sub:'誰に売るか'},
 {id:'p9',name:'IPを調べる',sub:'知的財産の確認'}
];
/* src: given=いただいた情報 / prop=私が補った提案(自由に編集・削除できます) */
const F={from:'m-1005',fromLabel:'10/5 打ち合わせ'};
const DEFAULT=[
 {id:'t1',p:'p1',text:'製作会社を決める(株式会社ワイテック)',done:true,src:'given'},
 {id:'t2',p:'p1',text:'素材を確認する(以前はポリカ/PCの話、4/27付の見積書はPP・マット白)',src:'given'},
 {id:'w1',p:'p1',text:'ワイテックに「溝なし」の仕様を伝える',src:'given',...F},
 {id:'t12',p:'p1',text:'色付きのテスト品を作ってもらえるかワイテックに確認する(難しければ3Dプリンタ試作品に上から塗装)',src:'given',...F},
 {id:'n1',p:'p1',text:'テスト品を発注する(アイボリーとブルーっぽい2色・カラー・溝なし)',src:'given',...F},
 {id:'n2',p:'p2',text:'特許を調べる(先行特許・類似品の確認)',src:'given'},
 {id:'n3',p:'p2',text:'弁理士など専門家に相談する',src:'prop'},
 {id:'n4',p:'p2',text:'特許を申請する',src:'given'},
 {id:'n5',p:'p3',text:'サイトを作るか検討して決める',src:'given'},
 {id:'n6',p:'p3',text:'商品の在庫管理の方法を決める',src:'given'},
 {id:'n7',p:'p3',text:'在庫を置く場所を決める',src:'given'},
 {id:'n8',p:'p3',text:'発送方法を決める',src:'given'},
 {id:'n9',p:'p3',text:'注文の取り方を決める',src:'given'},
 {id:'n10',p:'p4',text:'いくらで売るかを決める(見積もり単価・送料・在庫の費用も踏まえる)',src:'given'},

function quoteCalc(){
  const q=S.quotes, qty=+q.qty||0;
  let sub=[],total=0,unitSum=0,alt=0,hasAlt=false;
  q.rows.forEach(r=>{const p=r.price===''?NaN:+r.price;let v=NaN;
    if(!isNaN(p)){v=r.type==='lump'?p:p*qty;total+=v;if(r.type==='unit')unitSum+=p;
      if(r.type!=='lump'&&r.alt!==undefined&&r.alt!==''&&!isNaN(+r.alt)){alt+=(+r.alt-p)*qty;hasAlt=true;}}
    sub.push(v);});
  const bi=q.rows.findIndex(r=>r.type==='unit'&&r.price!==''&&+r.price>0);
  const base=bi>=0?+q.rows[bi].price:NaN;
  const ratio=!isNaN(base)?unitSum/base:NaN;
  const per=(qty>0&&total>0)?total/qty:NaN;
  return {sub,total,unitSum,per,ratio,qty,alt,hasAlt};
}

const addD=(x,n)=>{const d=new Date(x+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const segs=()=>{const base=SCHED_DEFAULT.map(x=>({...x,...((S.sched&&S.sched[x.id])||{})}));
  const o=base.find(x=>x.id==='s6'); if(o&&o.end) base.push({id:'s6L',p:'p6',label:'製造・納品 約2.5ヶ月(見積書)',start:addD(o.end,1),end:addD(o.end,LEAD),lead:true,tasks:[]});
  return base;};
const D0=x=>new Date(x+'T00:00:00');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function phRange(pid){
  const g=segs().filter(x=>x.p===pid&&x.start&&x.end); if(!g.length) return '未設定';
  const a=g.reduce((m,x)=>x.start<m?x.start:m,'9999'), b=g.reduce((m,x)=>x.end>m?x.end:m,'0000');
  return g.every(x=>x.kind==='deadline')?'〜'+fmtD(b):(a===b?fmtD(a):fmtD(a)+'〜'+fmtD(b));
}
function renderGantt(){
  const st=stat(), sg=segs().filter(x=>x.start&&x.end), tdy=todayStr();
  const mn=sg.reduce((m,x)=>x.start<m?x.start:m,'9999-12-31'), mx=sg.reduce((m,x)=>x.end>m?x.end:m,'0000-01-01');
  const A=new Date(D0(mn).getFullYear(),D0(mn).getMonth(),1), Bm=D0(mx), B=new Date(Bm.getFullYear(),Bm.getMonth()+1,1);
  const days=Math.round((B-A)/86400000);
  const pos=x=>(D0(x)-A)/86400000/days*100;
  const months=[]; for(let d=new Date(A);d<B;d=new Date(d.getFullYear(),d.getMonth()+1,1)){const nx=new Date(d.getFullYear(),d.getMonth()+1,1);months.push({m:d.getMonth()+1,y:d.getFullYear(),l:(d-A)/86400000/days*100,w:(nx-d)/86400000/days*100});}
  const lines=months.map(m=>`<div class="gline" style="left:${m.l}%"></div>`).join('');
  const todayIn=tdy>=ymd(A)&&tdy<ymd(B), tl=pos(tdy)+0.5/days*100;
  const todayLine=todayIn?`<div class="gtoday" style="left:${tl}%"></div>`:'';
  const head=`<div class="grow gh"><div class="glab"></div><div class="gtrack">${months.map((m,i)=>`<div class="gmon" style="left:${m.l}%;width:${m.w}%">${m.m}月<small>${(i===0||m.m===1)?m.y+'年':''}</small></div>`).join('')}${lines}${todayIn?`<span class="gtoday-l" style="left:${tl}%">今日</span>`:''}</div></div>`;
  const rows=st.ph.map((p,i)=>{
    const items=sg.filter(x=>x.p===p.id);
    const all=st.all;
    const bars=items.map(x=>{
      const ids=x.tasks||all.filter(t=>t.p===p.id).map(t=>t.id);
      const ts=all.filter(t=>ids.includes(t.id)); const dn=ts.filter(t=>t.done).length; const pct=ts.length?Math.round(dn/ts.length*100):0;
      const late=pct<100&&x.end<tdy, l=pos(x.start), w=(D0(x.end)-D0(x.start))/86400000+1;
      const title=`${p.name}: ${x.label}(${fmtD(x.start)}〜${fmtD(x.end)}) 進捗${pct}%${late?' ・期限超過':''}`;
      if(x.kind==='deadline'){const c=pos(x.end)+0.5/days*100;
        return `<div class="gdl ${pct===100?'done':''} ${late?'late':''}" style="left:${c}%" title="${esc(title)}"></div><span class="gdl-l" style="right:calc(${100-c}% + 18px)">${esc(x.label)}${late?' ▲超過':''}</span>`;}
      return `<div class="gbar ${pct===100?'done':''} ${late?'late':''} ${x.soft?'soft':''} ${x.lead?'lead':''}" style="left:${l}%;width:${w/days*100}%" title="${esc(title)}"><i class="gfill" style="width:${pct}%"></i><span>${esc(x.label)}${late?' ▲':''}</span></div>`;
    }).join('');
    return `<div class="grow"><div class="glab"><b>${i+1}. ${esc(p.name)}</b><span class="row" style="gap:6px">${chip(p.state==='done'?'ok':p.state==='cur'?'acc':'plain',p.state==='done'?'✓ 完了':p.state==='cur'?'▶ 進行中':'未着手')}<span class="sub">${p.done}/${p.total}</span></span></div><div class="gtrack">${lines}${todayLine}${bars}</div></div>`;
  }).join('');
  $('#gantt').innerHTML=`<div class="gt">${head}${rows}</div>`;
  const dl=st.all.filter(t=>!t.done&&t.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,7).map(t=>{
    const n=Math.round((D0(t.due)-D0(tdy))/86400000);
    const c=n<0?chip('bad','▲ 期限超過 '+(-n)+'日'):n===0?chip('hold','今日まで'):chip(n<=14?'hold':'plain','あと'+n+'日');
    return `<div class="due-l">${c}<span>${esc(t.text)}${t.wait?' '+chip('hold','◐ 回答待ち'):''}<span class="sub" style="display:block">${esc(phName(t.p))} ・ 期限 ${fmtD(t.due)}</span></span><button class="btn sm" data-go="todo" data-id="${t.id}">ToDoへ</button></div>`;}).join('');
  const s6=segs().find(x=>x.id==='s6'), s7=segs().find(x=>x.id==='s7'), s8=segs().find(x=>x.id==='s8');
  if(s6&&s7&&s8){
    const arr=addD(s6.end,LEAD), bad=arr>s7.start;
    $('#leadwarn').innerHTML=`<div class="row" style="gap:8px;margin-bottom:6px">${chip(bad?'bad':'ok',bad?'▲ 納期に注意':'✓ 納期はスケジュールの範囲内')}<b>原本の納期は「受注後 約2.5ヶ月」(4/27付の見積書)</b></div>
     <div>${fmtD(s6.end)}に発注すると、納品は <b>${fmtD(arr)}ごろ</b> です。${bad?`病院お試しの発送(${fmtD(s7.start)}〜)と販売開始(${fmtD(s8.start)})より後になります。`:''}</div>
     <ul style="margin:6px 0 0;padding-left:20px;font-size:13.5px"><li>病院お試しを${fmtD(s7.start)}に発送したい場合: 遅くとも <b>${fmtD(addD(s7.start,-LEAD))}</b> までに発注</li><li>${fmtD(s8.start)}に販売開始したい場合: 遅くとも <b>${fmtD(addD(s8.start,-LEAD))}</b> までに発注</li></ul>
     <div class="sub" style="margin-top:6px">金型づくりを含む納期の可能性があります。テスト品の納期は別です。発注日の目安は、期間を編集すると計算し直します。</div>`;
    $('#leadwarn').className='card '+(bad?'warnc':'');
  }
  $('#duelist').innerHTML=dl||'<div class="sub">期限つきの未完了タスクはありません。</div>';
}

const COLS=['meta','tasks','custom','meetings','feed','policy','pam','qrows','sched','log'];
const J=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,k2)=>(o[k2]=x[k2],o),{}):x);
const clean=o=>JSON.parse(JSON.stringify(o));
let DB=null, USER=null, REMOTE={}, LAST={}, FT=null, FLUSHING=false, rpending=false;

function syncSt(t){const e=$('#syncst'); if(e) e.textContent=t;}
function normalize(){
  S.feed.forEach(f=>{if(!f.id)f.id='f'+f.ts;});
  S.log.forEach((l,i)=>{if(!l.id){l.ts=l.ts||Date.now()-i;l.id='l'+l.ts;}});
  S.meetings.forEach(m=>{if(!m.ts)m.ts=Date.now();});
}
function toDocs(){
  normalize();
  const D={}, q=S.quotes;
  D['meta/main']={title:S.title,launch:S.launch||''};
  D['meta/sup']=clean(S.sup); D['meta/pam']={memo:S.pamMemo||''}; D['meta/quote']={qty:q.qty,thr:q.thr};
  Object.entries(S.tasks).forEach(([id,t])=>{const o=clean(t);if(Object.keys(o).length)D['tasks/'+id]=o;});
  S.custom.forEach(c=>{D['custom/'+c.id]=clean(c)});
  S.meetings.forEach(m=>{D['meetings/'+m.id]=clean(m)});
  S.feed.forEach(f=>{D['feed/'+f.id]=clean(f)});
  Object.entries(S.policy).forEach(([id,v])=>{D['policy/'+id]={s:v}});
  Object.entries(S.pam).forEach(([id,v])=>{if(v)D['pam/'+id]={v:true}});
  q.rows.forEach((r,i)=>{D['qrows/'+r.id]={...clean(r),ord:i}});
  Object.entries(S.sched||{}).forEach(([id,o])=>{D['sched/'+id]=clean(o)});
  S.log.forEach(l=>{D['log/'+l.id]=clean(l)});
  return D;
}
function fromDocs(R){
  const col=c=>Object.keys(R).filter(p=>p.startsWith(c+'/')).map(p=>[p.slice(c.length+1),R[p]]);
  const n=baseState(), m=R['meta/main']||{}, su=R['meta/sup']||{}, pm=R['meta/pam']||{}, qm=R['meta/quote']||{};
  if(m.title!==undefined) n.title=m.title; n.launch=m.launch||'';
  n.sup={...n.sup,...clean(su)}; n.pamMemo=pm.memo||'';
  if(qm.qty!==undefined) n.quotes.qty=qm.qty; if(qm.thr!==undefined) n.quotes.thr=qm.thr;
  n.tasks=Object.fromEntries(col('tasks').map(([id,d])=>[id,clean(d)]));
  n.custom=col('custom').map(([id,d])=>({...clean(d),id})).sort((a,b)=>a.id<b.id?-1:1);
  n.meetings=col('meetings').map(([id,d])=>({...clean(d),id})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0));
  n.feed=col('feed').map(([id,d])=>({...clean(d),id})).sort((a,b)=>b.ts-a.ts).slice(0,60);
  n.policy=Object.fromEntries(col('policy').map(([id,d])=>[id,d.s]));
  n.pam=Object.fromEntries(col('pam').map(([id])=>[id,true]));
  n.quotes.rows=col('qrows').map(([id,d])=>({...clean(d),id})).sort((a,b)=>(a.ord||0)-(b.ord||0));
  n.sched=Object.fromEntries(col('sched').map(([id,d])=>[id,clean(d)]));
  n.log=col('log').map(([id,d])=>({...clean(d),id})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0));
  n.qv=2;n.mv=1;n.tv=1;
  return n;
}
const jsonMap=D=>{const o={};for(const p in D)o[p]=J(D[p]);return o;};
function diffDocs(cur,last){
  const sets={},dels=[],cj=jsonMap(cur);
  for(const p in cj) if(last[p]!==cj[p]) sets[p]=cur[p];
  for(const p in last) if(!(p in cj)) dels.push(p);
  return {sets,dels};
}
function applyRemote(){
  const pend=diffDocs(toDocs(),LAST);   /* まだ送っていない自分の変更 */
  const merged={...REMOTE}; Object.assign(merged,pend.sets); pend.dels.forEach(p=>delete merged[p]);
  LAST=jsonMap(REMOTE);
  S=fromDocs(merged);
  tryRender(); resolveNames();
  if(Object.keys(pend.sets).length||pend.dels.length) scheduleFlush();
}
function tryRender(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('main')&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!['checkbox','button'].includes(a.type)))){rpending=true;return;}
  rpending=false; renderAll();
}
document.addEventListener('focusout',()=>{ if(rpending) setTimeout(tryRender,120); });
function scheduleFlush(){ if(!SHARED||!READY||RO) return; clearTimeout(FT); FT=setTimeout(flush,700); syncSt('保存待ち…'); }
async function flush(){
  if(FLUSHING){scheduleFlush();return;}
  FLUSHING=true; syncSt('保存中…');
  try{
    const cur=toDocs(), d=diffDocs(cur,LAST);
    const cj=jsonMap(cur);
    for(const p of Object.keys(d.sets)){
      const old=LAST[p]; LAST[p]=cj[p];
      try{ await DB.doc(p).set(d.sets[p]); }
      catch(e){ if(e&&e.code==='unavailable'){ await new Promise(r=>setTimeout(r,600)); try{await DB.doc(p).set(d.sets[p]);}catch(e2){ if(old===undefined)delete LAST[p]; else LAST[p]=old; throw e2;} } else { if(old===undefined)delete LAST[p]; else LAST[p]=old; throw e; } }
    }
    for(const p of d.dels){ const old=LAST[p]; delete LAST[p]; try{ await DB.doc(p).delete(); }catch(e){ LAST[p]=old; throw e; } }
    syncSt('保存しました '+fmtTs(Date.now()));
  }catch(e){
    if(e&&(e.code==='invalid_argument')){ RO=true; document.body.classList.add('ro'); setShare('ro'); }
    else if(e&&e.code==='quota_exceeded'){ setShare('err','データの上限に達しました。古いデータを削除してください。'); }
    else { setShare('err',(e&&e.code)?e.code:'通信できません。しばらくしてからもう一度お試しください。'); setTimeout(()=>{if(SHARED&&!RO){setShare('live');scheduleFlush();}},8000); }
  }finally{ FLUSHING=false; }
}
async function resolveNames(){
  if(!USER||!SHARED) return;
  const ids=[...new Set(S.feed.map(f=>f.by).filter(Boolean))].filter(i=>!(i in NAMES)); if(!ids.length) return;
  try{ const ps=await USER.profiles(ids); let ch=false; ids.forEach(i=>{const n=ps&&ps[i]&&ps[i].name||''; NAMES[i]=n; if(n)ch=true;}); if(ch){renderHeader();renderOverview();} }catch(e){}
}
function subscribeAll(){
  return new Promise(resolve=>{
    let got=0;
    COLS.forEach(c=>{
      let first=true;
      DB.collection(c).onSnapshot(snap=>{
        Object.keys(REMOTE).forEach(p=>{if(p.startsWith(c+'/'))delete REMOTE[p];});
        snap.docs.forEach(d=>{REMOTE[c+'/'+d.id]=d.data();});
        if(first){first=false;got++;if(got===COLS.length)resolve();}
        else if(READY) applyRemote();
      },err=>{ if(err&&err.code==='revoked'){setShare('ro');RO=true;document.body.classList.add('ro');} else setShare('err',err&&err.code||''); if(first){first=false;got++;if(got===COLS.length)resolve();} });
    });
  });
}
async function initShared(){
  try{
    if(!window.claude||!window.claude.use){ setShare('local'); return; }
    setShare('connect');
    DB=await claude.use('db'); USER=await claude.use('user');
    if(!DB){ setShare('local'); return; }
    ME=USER?await USER.id():null;
    const owner=USER?await USER.isOwner():false;
    const canW=USER?await USER.can('data.write'):null;
    const head=await DB.doc('meta/main').get();
    if(!head.exists){
      if(!owner||canW===false){
        setShare('wait'); DB.doc('meta/main').onSnapshot(sn=>{ if(sn.exists) location.reload(); }); return;
      }
      /* 持ち主が最初に開いたとき: いまの内容を共有データとして登録 */
      setShare('connect','(初回: 共有データを作成中)');
      const D=toDocs(); const order=Object.keys(D).filter(p=>p!=='meta/main').concat(['meta/main']);
      for(const p of order){ await DB.doc(p).set(D[p]); }
    }
    await subscribeAll();
    SHARED=true; try{localStorage.removeItem(SKEY)}catch(e){}
    S=fromDocs(REMOTE); LAST=jsonMap(REMOTE); READY=true;
    $('#resetBtn').hidden=true; $('#footnote').textContent='共有がオンです。入力内容は、このリンクを開いている全員で共有されます。';
    if(canW===false){RO=true;document.body.classList.add('ro');setShare('ro');} else { setShare('live'); syncSt('保存済み'); }
    renderAll(); resolveNames();
  }catch(e){ SHARED=false; setShare('err',(e&&e.code)||'共有に接続できませんでした。この端末のブラウザには保存されます。'); }
}

let armed=false;
$('#resetBtn').addEventListener('click',e=>{ if(SHARED) return;
  if(!armed){armed=true;e.target.textContent='もう一度押すと、すべて初期状態に戻ります';setTimeout(()=>{armed=false;e.target.textContent='保存内容をすべて消す'},4000);return;}
  try{localStorage.removeItem(SKEY)}catch(err){}
  location.reload();
});
